# Netlify — hosts the Next.js storefront (free yourname.netlify.app domain).
# The Fastify API CANNOT run on Netlify (needs long-running Node) — keep it on
# Render/Fly/VPS and point NEXT_PUBLIC_API_URL at it (Netlify UI → Site settings
# → Environment variables). Auto-deploy is on by default: every push to main
# rebuilds + republishes the site, no action needed.
[build]
  base = "apps/web"
  command = "npm ci && npm run build"
  # NOTE: publish is relative to base, so this means apps/web/.next
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Cache Next.js build output between deploys
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must always revalidate (else updates never reach devices)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache"

# Next.js Runtime — required to serve App Router pages (SSR + dynamic routes).
# Without this, deploys succeed but every route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
