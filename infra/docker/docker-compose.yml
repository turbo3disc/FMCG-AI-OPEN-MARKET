# Local stack (free): Postgres 16 + PostGIS, Redis, MinIO (S3), API, web.
# Run: docker compose -f infra/docker/docker-compose.yml up -d
name: fmcg-open-market

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: fmcg
      POSTGRES_USER: fmcg
      POSTGRES_PASSWORD: fmcg_dev_only
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fmcg
      MINIO_ROOT_PASSWORD: fmcg_dev_only_123
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniidata:/data]

volumes:
  pgdata:
  redisdata:
  miniidata:
